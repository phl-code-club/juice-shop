  welcomeBanner:
    showOnFirstStart: true
    title: 'Welcome to Intergalactic Bazaar!'
    # TODO Customize this, explain how we customized Juice Shop
    message: "<h4>cash only · no returns · no promises</h4><p>Welcome <i>Earthling</i> to the <b>Intergalactic Bazaar</b>! A pit stop shop for your boundless voyage through the vast cosmos. We can't promise you the finest of supplies, but we're positive you'll discover what you need and what you didn't know existed at the bazaar. <br><br>There's poodles galor, we'd really appreciate if you space travelers quit leaving your creatures behind.  Useless gadgets, who knows if they actually do what it says on the label. We've got it all, even unexplainable saucer scraps (Don't ask how we got those items). If you can't find what you seek here, do you actually need it? <br><br>Still struggling? Well look a tad harder, Earthling, we don't have all day. Cash in on these incredible sales in the next twentyfour hours, there's no promise we'll be in business tomorrow.</p>"
  cookieConsent:
    message: 'Intergalactic Bazaar forcibly provides your browser with cookies. IntergalactiCorp does not respect GDPR 👿.'
    dismissText: 'Accept all cookies, or perish.'
    linkText: ''
    linkUrl: ''
  # Might 
  securityTxt:
    contact: 'mailto:donotreply@intergalactic.bazaar'
    encryption: 'https://keybase.io/bkimminich/pgp_keys.asc?fingerprint=19c01cb7157e4645e9e2c863062a85a8cbfbdcda'
    acknowledgements: '/#/score-board'
    hiring: '/#/jobs'
    csaf: '/.well-known/csaf/provider-metadata.json' # scheme,host,port taken from baseUrl
  promotion:
    video: owasp_promo.mp4
    subtitles: owasp_promo.vtt
  easterEggPlanet:
    name: Orangeuze
    overlayMap: orangemap2k.jpg
